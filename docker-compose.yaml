version: "3.9"


networks:
  molops-net:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:
  mlflow-data:

services:

  molops-api:
    image: lyhamsea/molops:${CHEMOPS_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        BUILD_DATE: ${BUILD_DATE:-unknown}
        GIT_SHA: ${GIT_SHA:-unknown}
    container_name: molops-api
    restart: unless-stopped
    ports:
      - "${MOLOPS_PORT:-8001}:8001"
    env_file:
      - .env
    environment:
      MOLOPS_ENV: "${MOLOPS_ENV:-development}"
      MLFLOW_TRACKING_URI: "http://mlflow:5000"
      MODEL_PATH: "/app/models/random_forest.joblib"
      SMILES_PATH: "/app/models/training_smiles.txt"
      PYTHONUNBUFFERED: "1"
    networks:
      - molops-net
    depends_on:
      - mlflow
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.13.0
    container_name: molops-mlflow
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/mlflow
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri /mlflow/mlruns
      --default-artifact-root /mlflow/artifacts
    networks:
      - molops-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: molops-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    networks:
      - molops-net
    depends_on:
      molops-api:
        condition: service_healthy

  grafana:
    image: grafana/grafana:10.4.3
    container_name: molops-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      GF_SECURITY_ADMIN_USER: "${GF_SECURITY_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GF_SECURITY_ADMIN_PASSWORD:-molops_dev}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - molops-net
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
