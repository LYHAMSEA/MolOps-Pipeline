global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: "molops"
    environment: "development"

rule_files:
  - "/etc/prometheus/alerts.yml"

scrape_configs:
  - job_name: "molops-api"
    static_configs:
      - targets: ["192.168.56.20:8001"]
    metrics_path: "/metrics"
    scrape_interval: 10s

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]