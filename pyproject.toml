[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "molops"
version = "0.1.0"
description = "MLOps-Driven Cheminformatics Pipeline for Data-Driven Drug Bioactivity Prediction"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "prometheus-client>=0.20.0",
    "chembl-webresource-client>=0.10.9",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.5.0",
    "xgboost>=2.0.0",
    "mlflow>=2.13.0",
    "joblib>=1.4.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-timeout>=2.3.0",
    "jupyterlab>=4.2.0",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
    "ipykernel>=6.29.0",
]
lint = [
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "bandit>=1.7.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["molops*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["molops"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 70

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["molops", "tests"]

[tool.ruff.lint]
select = ["E","W","F","I","N","UP","B","ANN","RUF"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN","S101"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
